name: Build TGUI
description: Install the pinned frontend dependencies and compile browser assets.
inputs:
  check:
    description: Run TypeScript and Jest checks before building.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24.13.0'
    - name: Build
      shell: bash
      run: node scripts/build-tgui.cjs ${{ inputs.check == 'true' && '--check' || '' }}
