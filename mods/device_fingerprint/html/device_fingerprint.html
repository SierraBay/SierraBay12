<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Device Fingerprint</title>
</head>
<body style="margin:0;overflow:hidden;background:transparent;">
<script>
(function () {
	function persistentToken() {
		try {
			var key = "sierra_device_fp_token";
			var token = localStorage.getItem(key);
			if (!token) {
				var random = "";
				if (window.crypto && window.crypto.getRandomValues) {
					var values = new Uint32Array(4);
					window.crypto.getRandomValues(values);
					random = Array.prototype.join.call(values, "-");
				} else {
					random = String(Math.random()).slice(2) + "-" + String(Math.random()).slice(2);
				}
				token = String(Date.now()) + "-" + random;
				localStorage.setItem(key, token);
			}
			return token;
		} catch (e) {
			return "";
		}
	}

	function webglInfo() {
		try {
			var canvas = document.createElement("canvas");
			var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
			if (!gl) {
				return {};
			}
			var dbg = gl.getExtension("WEBGL_debug_renderer_info");
			if (!dbg) {
				return {};
			}
			return {
				webgl_vendor: gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || "",
				webgl_renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || ""
			};
		} catch (e) {
			return {};
		}
	}

	function hashString(value) {
		var hash = 2166136261;
		for (var i = 0; i < value.length; i++) {
			hash ^= value.charCodeAt(i);
			hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
		}
		return ("0000000" + (hash >>> 0).toString(16)).slice(-8);
	}

	function canvasFingerprint() {
		try {
			var canvas = document.createElement("canvas");
			canvas.width = 240;
			canvas.height = 80;
			var ctx = canvas.getContext("2d");
			if (!ctx) {
				return "";
			}

			ctx.textBaseline = "alphabetic";
			ctx.fillStyle = "#f60";
			ctx.fillRect(10, 10, 100, 45);
			ctx.fillStyle = "#069";
			ctx.font = "16px Arial";
			ctx.fillText("Sierra Bay fp 1.0", 14, 32);
			ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
			ctx.font = "18px Times New Roman";
			ctx.fillText("Canvas \u2603 fingerprint", 12, 58);
			ctx.globalCompositeOperation = "multiply";
			ctx.fillStyle = "rgb(255,0,255)";
			ctx.beginPath();
			ctx.arc(160, 30, 25, 0, Math.PI * 2, true);
			ctx.closePath();
			ctx.fill();
			ctx.fillStyle = "rgb(0,255,255)";
			ctx.beginPath();
			ctx.arc(185, 30, 25, 0, Math.PI * 2, true);
			ctx.closePath();
			ctx.fill();
			ctx.fillStyle = "rgb(255,255,0)";
			ctx.beginPath();
			ctx.arc(172, 52, 25, 0, Math.PI * 2, true);
			ctx.closePath();
			ctx.fill();

			return hashString(canvas.toDataURL());
		} catch (e) {
			return "";
		}
	}

	var gl = webglInfo();
	var payload = {
		ua: navigator.userAgent || "",
		lang: navigator.language || "",
		tz: String(new Date().getTimezoneOffset()),
		screen: String(screen.width || 0) + "x" + String(screen.height || 0) + "x" + String(screen.colorDepth || 0),
		dpr: String(window.devicePixelRatio || 1),
		dnt: navigator.doNotTrack || "",
		platform: navigator.platform || "",
		hardware_concurrency: String(navigator.hardwareConcurrency || ""),
		device_memory: String(navigator.deviceMemory || ""),
		webdriver: String(!!navigator.webdriver),
		webgl_vendor: gl.webgl_vendor || "",
		webgl_renderer: gl.webgl_renderer || "",
		canvas_hash: canvasFingerprint(),
		persistent_token: persistentToken()
	};

	location.href = "byond://?src=__CLIENT_REF__;device_fp_browser=1;nonce=__NONCE__;payload=" + encodeURIComponent(JSON.stringify(payload));
	setTimeout(function () {
		window.close();
	}, 100);
})();
</script>
</body>
</html>
