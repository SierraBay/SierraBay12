<html>

<head>
  <title>Create Object</title>
  <style type="text/css">
    body
    {
      font-size: 9pt;
      font-family: Verdana, sans-serif;
    }

    h1, h2, h3, h4, h5, h6
    {
      color: #00f;
      font-family: Georgia, Arial, sans-serif;
    }
    img {
      border: 0px;
    }
    p.lic {
      font-size: 6pt;
    }
  </style>
</head>

<body>
	<form name="spawner" action="byond://?src=/* ref src */" method="get">
		<input type="hidden" name="src" value="/* ref src */">
		<input type="hidden" name="category" value="/* ref category */">
		<input type="hidden" name="action" value="vr_object_list">

		Type <input type="text" name="filter" value="" style="width:280px;height:25"> <input type = "submit" value = "Search" onclick = "updateSearch()" /><br>
		<br><br>

		<select name="vr_object_list" id="vr_object_list" multiple size="18"  style="width:98%">
		</select>

		<br>
		<br>
		<input type="submit" value="spawn">
	</form>

	<script language="JavaScript">
		var old_search = "";
		var object_list = document.spawner.vr_object_list;
		var object_paths = null /* object types */;
		var objects = object_paths == null ? new Array() : object_paths.split(";");

		document.spawner.filter.focus();

		function populateList(from_list)
		{
			object_list.options.length = 0;

			var i;
			for (i in from_list)
			{
				var new_option = document.createElement("option");
				new_option.value = from_list[i];
				new_option.text = from_list[i];
				object_list.options.add(new_option);
			}
		}

		function updateSearch()
		{
			var new_search = document.spawner.filter.value.toLowerCase();
			if (old_search == new_search && new_search != "")
				return false;

			old_search = new_search;

			var filtered = new Array();
			var i;
			for (i in objects)
			{
				var caseInsensitiveObject = objects[i].toLowerCase();
				if(caseInsensitiveObject.search(old_search) < 0)
				{
					continue;
				}

				filtered.push(objects[i]);
			}

			populateList(filtered);

			return true;
		}
		
		updateSearch();
	</script>
</body>

</html>
