author: Roche Hendson
changes:
  - bugfix: Skinsight теперь снова работает и не требует захвата для 
      сканирования
  - bugfix: Телекинетики Гиммель снова могут бросать своих жертв
  - bugfix: Теле-удар теперь не бьет вещи в инвентаре
  - tweak: Грандмастера (Алеф) псионики, теперь не должны быть в сознании, чтобы
      пассивно использовалась псионика. Так же, даже будучи в наручниках, они 
      могут делать прокасты.
  - tweak: Мулы тратят меньше стамины на использование пси-защиты. Эффект 
      скалируется с количеством поврежденных конечностей.
  - tweak: Владельцы дисциплин сознания, шейманизма, принуждения, теперь могут 
      блокировать некоторые прокасты.
  - tweak: Выстрел сосульками теперь выглядит как стрельба очередями
  - rscadd: Переработана пси-оборона.
delete-after: true
