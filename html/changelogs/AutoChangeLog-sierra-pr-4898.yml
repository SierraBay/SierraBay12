author: EngagingLakeTahoe
changes:
  - rscadd: Six new recipes. (Dark Orchard Pie, Ham Slider, Pear Compote, 
      Charcuterie Board, Mozzarella Sticks, Caprese Salad.)
  - rscadd: Two new cheeses. (Mozzarella and Burrata)
  - rscadd: Four new wines. (Andalusia Vinyeards Sherry, New Douro Vintage 2293,
      Chartreuse Valley Rose, Cloud District 9)
  - rscadd: New Kitchen tool. (Cheesecloth)
  - tweak: Added kitchen tag to grapes
  - tweak: Added Chartreuse Valley Rose to Boozeomat. Added cheesecloth to 
      Utensil vendor.
  - bugfix: Removed the cocktail glass from the Shrimp Cocktail recipe as a 
      cocktail glass isn't considered an ingredient you can cook with and 
      removing it put the recipe more in line with how Bay's recipes work when 
      it comes to how dishes are provided for foods (aka no other recipe has us 
      supply the dish its served in as part of the recipe).
delete-after: true
