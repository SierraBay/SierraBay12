author: Roche Hendson
changes:
  - bugfix: Истощенный разум псионика теперь не позволит подавлять способности 
      самостоятельно
  - bugfix: Авейкам не должен выдаватся имплант подавления если они этого не 
      хотят
  - bugfix: Истощение псионика не задействует латентов
  - tweak: Триглаз медленее метаболизируется, повышает уровень дисциплины на 
      время действия и вызывает ужасы при выветривании.
  - tweak: Телепаты мастера могут связать больше чем одну цель, создавая 
      одностороннюю связь со всеми в связи.
  - tweak: Невидимость у псиоников мерцает при получении урона или попытке 
      ударить
  - tweak: Операнты психокинезиса могут взять цель, но не могут её кидать. 
      Позволяет дистанционно патать и бить в пах.
  - soundadd: Добавил звук скримера
  - rscadd: Добавил новую способность, Revelate fear для сознанцев. Насылает 
      скримеры на людей, создавая неприятные виды.
delete-after: true
